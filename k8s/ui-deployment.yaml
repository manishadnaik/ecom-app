apiVersion: apps/v1
kind: Deployment
metadata: { name: react-ui }
spec:
  replicas: 2
  selector: { matchLabels: { app: react-ui } }
  template:
    metadata: { labels: { app: react-ui } }
    spec:
      containers:
        - name: ui
          image: my-app/react-ui:latest # built from apps/react-ui/Dockerfile
          ports: [{ containerPort: 80 }]
          # nginx serves static files, / is enough. api health lives on node-api.
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: react-ui }
spec:
  selector: { app: react-ui }
  ports: [{ port: 80, targetPort: 80 }]
