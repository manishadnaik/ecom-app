# nginx for react-ui: serve vite build + fallback to index.html (react-router).
# /api/ goes to node-api service so browser has same-origin calls.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://node-api:80/api/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
